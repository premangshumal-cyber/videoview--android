name: Build & Release KinePulse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for easy mobile installation
        run: cp app/build/outputs/apk/debug/app-debug.apk KinePulse-v1.0.0-debug.apk

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinePulse-Installable-APK
          path: KinePulse-v1.0.0-debug.apk

      - name: Publish APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "KinePulse Android APK (Ready to Install)"
          body: "Tap **KinePulse-v1.0.0-debug.apk** under Assets below on your Android phone to download and install."
          files: KinePulse-v1.0.0-debug.apk
          prerelease: false
