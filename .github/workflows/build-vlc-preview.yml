name: Build VLC-style reconstruction preview

on:
  push:
    branches: [vlc-style-reconstruction]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile preview APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KinePulse-VLC-style-preview-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KinePulse-VLC-style-preview
          path: KinePulse-VLC-style-preview-debug.apk
          if-no-files-found: error
      - name: Publish experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vlc-style-0.2.0-preview
          name: KinePulse VLC-style Preview (Experimental)
          prerelease: true
          make_latest: false
          body: |
            Experimental KinePulse preview. Not official VLC and not feature-complete.
            The opt-in local Wi-Fi catalog is read-only and uses HTTP. Use only on trusted LANs.
            Source and missing features are documented in docs/RECONSTRUCTION_STATUS.md.
          files: KinePulse-VLC-style-preview-debug.apk
